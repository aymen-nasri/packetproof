name: bundle

# Every merge to main renders the network into one deterministic config bundle, records build
# provenance for it (a GitHub artifact attestation, SLSA build level 2) and signs it with cosign.
# The prod workflow refuses any bundle whose attestation and signature do not verify.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -r requirements.txt
      - name: Render and pack deterministically
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m packetproof render --out out/lab
          echo "$GITHUB_SHA" > out/lab/COMMIT
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -C out -cf - lab \
            | gzip -n > "packetproof-config-$GITHUB_SHA.tgz"
          sha256sum "packetproof-config-$GITHUB_SHA.tgz" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packetproof-config-${{ github.sha }}.tgz
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign with cosign
        run: cosign sign-blob --yes --bundle "packetproof-config-$GITHUB_SHA.sigstore.json" "packetproof-config-$GITHUB_SHA.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config-bundle
          path: packetproof-config-*
          retention-days: 90
