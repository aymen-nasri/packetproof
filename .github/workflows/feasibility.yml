name: feasibility

# The feasibility checks of docs/method.md, part 1: can free GitHub runners carry this project?
# (Test E, local development on Windows, is not a CI test.) The verdict job applies the GO rules
# exactly as written there; the recorded results are in docs/feasibility.md. It runs on demand, and
# on any pull request that changes the checks, so they keep working.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "feasibility/**"
      - ".github/workflows/feasibility.yml"

permissions: {}

concurrency:
  group: feasibility-${{ github.ref }}
  cancel-in-progress: false

env:
  BATFISH_IMAGE: batfish/allinone@sha256:54cb0ed94fd9a3c1ca0985f73e5be479e955cee9b9f6a6799b66be3364fd8e5c

jobs:
  lab:
    name: tests A and C (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    env:
      RUN: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-lab
      - name: Test A, deploy feas-bgp and check it
        run: python3 feasibility/lab.py --lab feas-bgp --out "results/A-run$RUN.json" --evidence "evidence/A-run$RUN"
      - name: Test C, deploy feas-wg (BGP over WireGuard) and check it
        if: ${{ !cancelled() }}
        run: |
          sudo modprobe wireguard
          python3 feasibility/lab.py --lab feas-wg --out "results/C-run$RUN.json" --evidence "evidence/C-run$RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lab-run-${{ matrix.run }}
          path: |
            results/
            evidence/
          retention-days: 90

  batfish:
    name: test B (Batfish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Batfish, pinned by digest
        run: docker run -d --name batfish -p 9996:9996 "$BATFISH_IMAGE"
      - name: Install pybatfish, hash-locked
        run: make venv-batfish VENV="$RUNNER_TEMP/bf"
      - name: Render the baseline, the planted error and the tunnel snapshot
        run: |
          python3 feasibility/render.py --lab feas-bgp --out build/feas-bgp
          python3 feasibility/render.py --lab feas-bgp --fault FEAS-F --out build/feas-bgp-FEAS-F
          python3 feasibility/render.py --lab feas-wg --out build/feas-wg
      - name: Test B, ask Batfish
        run: >-
          "$RUNNER_TEMP/bf/bin/python" feasibility/batfish_check.py
          --baseline build/feas-bgp/batfish --fault build/feas-bgp-FEAS-F/batfish
          --wg build/feas-wg/batfish --out results/B.json
      - name: For the record, FRR's own syntax check (not part of the verdict)
        if: ${{ !cancelled() }}
        run: |
          docker build -q -t packetproof/router:feas images/router
          # vtysh -C checks frr.conf in its config directory, so mount each rendered directory there.
          for d in build/feas-bgp/configs/* build/feas-wg/configs/*; do
            echo "== $d/frr.conf"
            docker run --rm -v "$PWD/$d:/tmp/cfg:ro" --entrypoint vtysh packetproof/router:feas               --config_dir /tmp/cfg --dryrun 2>&1 && echo "exit 0" || echo "exit $?"
          done | tee results/B-vtysh-dryrun.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: batfish
          path: |
            results/
            build/feas-bgp/batfish/
            build/feas-bgp-FEAS-F/batfish/
            build/feas-wg/batfish/
          retention-days: 90

  budget:
    name: test D (time budget)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Start the clock
        run: date +%s.%N > "$RUNNER_TEMP/t0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-lab
      - name: Start Batfish and install pybatfish
        run: |
          docker run -d --name batfish -p 9996:9996 "$BATFISH_IMAGE"
          make venv-batfish VENV="$RUNNER_TEMP/bf"  # hash-locked
      - name: Static stage, render and ask Batfish test B's questions
        run: |
          python3 feasibility/render.py --lab feas-bgp --out build/feas-bgp
          python3 feasibility/render.py --lab feas-bgp --fault FEAS-F --out build/feas-bgp-FEAS-F
          set +e
          "$RUNNER_TEMP/bf/bin/python" feasibility/batfish_check.py --baseline build/feas-bgp/batfish \
            --fault build/feas-bgp-FEAS-F/batfish --out results/D-full-batfish.json
          echo "batfish exit $?"
      - name: Live stage, deploy feas-wg and run test C's checks
        run: |
          sudo modprobe wireguard
          set +e
          python3 feasibility/lab.py --lab feas-wg --out results/D-full-lab.json
          echo "lab exit $?"
      - name: Stop the clock for the full run
        run: date +%s.%N > "$RUNNER_TEMP/t1"
      - name: One planted fault (FEAS-F), warm, timed
        run: |
          date +%s.%N > "$RUNNER_TEMP/f0"
          set +e
          python3 feasibility/render.py --lab feas-bgp --fault FEAS-F --out build/cycle/feas-bgp-FEAS-F
          "$RUNNER_TEMP/bf/bin/python" feasibility/batfish_check.py --routes-only \
            --fault build/cycle/feas-bgp-FEAS-F/batfish --out results/D-fault-batfish.json
          python3 feasibility/lab.py --lab feas-bgp --fault FEAS-F --build build/cycle --out results/D-fault-lab.json
          date +%s.%N > "$RUNNER_TEMP/f1"
      - name: Write the time-budget result
        run: >-
          python3 feasibility/budget.py --t0 "$RUNNER_TEMP/t0" --t1 "$RUNNER_TEMP/t1"
          --fault-start "$RUNNER_TEMP/f0" --fault-end "$RUNNER_TEMP/f1" --results results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: budget
          path: results/
          retention-days: 90

  verdict:
    name: verdict
    needs: [lab, batfish, budget]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Apply the GO rules from docs/method.md
        run: |
          set -o pipefail
          mkdir -p results
          find artifacts -name '*.json' -exec cp {} results/ \;
          python3 feasibility/verdict.py results | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verdict
          path: results/
          retention-days: 90
