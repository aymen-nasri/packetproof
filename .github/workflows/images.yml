name: images

# The two lab images (router, node) are built from Dockerfiles whose bases are pinned by digest,
# scanned with Trivy (any fixable CRITICAL blocks), described by a CycloneDX SBOM, pushed to GHCR,
# signed keylessly with cosign, given an SBOM attestation and a build provenance attestation, and
# verified. The prod workflow pulls them by digest and verifies the signature before use.
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "17 5 * * 1"   # weekly rescan: new CVEs are published against unchanged images
  workflow_dispatch:

permissions: {}

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [router, node]
    env:
      IMAGE: ${{ matrix.image }}
      REPO: ghcr.io/${{ github.repository_owner }}/packetproof-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy 0.76.2, checking its checksum
        run: |
          curl -fsSLo "$RUNNER_TEMP/trivy.tgz" https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      - name: Build
        run: docker build -q -t "$REPO:$GITHUB_SHA" "images/$IMAGE"
      - name: Scan; any fixable CRITICAL vulnerability blocks
        run: |
          "$RUNNER_TEMP/trivy" image --quiet --severity HIGH,CRITICAL --ignore-unfixed "$REPO:$GITHUB_SHA" | tee "$RUNNER_TEMP/scan.txt"
          "$RUNNER_TEMP/trivy" image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "$REPO:$GITHUB_SHA"
      - name: SBOM (CycloneDX)
        run: '"$RUNNER_TEMP/trivy" image --quiet --format cyclonedx --output "$RUNNER_TEMP/sbom.cdx.json" "$REPO:$GITHUB_SHA"'
      - name: Push to GHCR
        if: ${{ github.ref == 'refs/heads/main' }}
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$REPO:$GITHUB_SHA" "$REPO:main"
          docker push -q "$REPO:$GITHUB_SHA"
          docker push -q "$REPO:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPO:$GITHUB_SHA" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ github.ref == 'refs/heads/main' }}
      - name: Sign, attest the SBOM, and verify the signature
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/images.yml@${{ github.ref }}
        run: |
          cosign sign --yes "$REPO@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/sbom.cdx.json" "$REPO@$DIGEST"
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REPO@$DIGEST" > /dev/null
          echo "signed and verified: $REPO@$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Keep the scan and the SBOM
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/scan.txt" "out/$IMAGE-scan.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/sbom.cdx.json" "out/$IMAGE-sbom.cdx.json" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: image-${{ matrix.image }}
          path: out/
          retention-days: 90
