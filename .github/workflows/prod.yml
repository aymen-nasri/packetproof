name: prod

# "Prod" has no always-on free host, so it is rebuilt from the previous config bundle and the newest
# bundle is applied to it in place, as a real change would land:
#   1. pull the lab images by digest and verify their cosign signatures before use
#   2. verify both bundles' attestations and signatures, and prove a tampered bundle is refused
#   3. rebuild prod from the previous bundle
#   4. apply the new bundle in place (frr-reload.py, one atomic nft transaction per router) while two
#      probes each hold one TCP connection and count failed requests
#   5. check for drift (after a self-test that planted drift is caught), then run all of Gate 2
# Prod's long-lived identities (both routers' WireGuard keys and the CA root) come from
# secrets/prod.sops.yaml, decrypted with the age key held only in the prod environment's secret
# SOPS_AGE_KEY; step 3c checks that prod really runs them (docs/secrets.md).
on:
  workflow_dispatch:
    inputs:
      from_run:
        description: "bundle.yml run ID to rebuild prod from (default: the second newest)"
        required: false
      to_run:
        description: "bundle.yml run ID to apply in place (default: the newest)"
        required: false
  schedule:
    - cron: "29 3 * * 0"

permissions: {}

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The age key is an environment secret: only jobs that run from main can read it.
    environment: prod
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      IMAGES_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/images.yml@refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-lab
        with:
          build-images: "false"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install Python dependencies
        run: make venv VENV="$RUNNER_TEMP/venv"
      - name: Install SOPS 3.13.3, checking its checksum
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c
          chmod +x "$RUNNER_TEMP/sops"
      - name: 1. Pull the signed images by digest and verify them before use
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p results
          for img in router node; do
            ref="ghcr.io/$OWNER/packetproof-$img"
            docker pull -q "$ref:main"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref:main" | cut -d@ -f2)
            cosign verify --certificate-identity "$IMAGES_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref@$digest" > /dev/null
            docker tag "$ref@$digest" "packetproof/$img:dev"
            echo "$img $ref@$digest verified" | tee -a results/images.txt
          done
      - name: 2. Fetch the two bundles and verify them; a tampered one must be refused
        env:
          FROM_RUN: ${{ inputs.from_run }}
          TO_RUN: ${{ inputs.to_run }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/prod.py fetch --from-run "$FROM_RUN" --to-run "$TO_RUN" --out prod/fetched.json
          "$RUNNER_TEMP/venv/bin/python" scripts/prod.py verify --out results/verify.json
      - name: Decrypt prod's identities (SOPS, age key from the prod environment)
        id: decrypt
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$SOPS_AGE_KEY" ] && [ -f secrets/prod.sops.yaml ]; then
            umask 077
            # A key stored from Windows PowerShell 5.1 through a pipe arrives with a UTF-8 byte-order
            # mark and a CR, which age rejects ("unknown identity type", run 42878657349).
            key=$(printf '%s' "$SOPS_AGE_KEY" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r')
            SOPS_AGE_KEY="$key" "$RUNNER_TEMP/sops" decrypt --output-type json secrets/prod.sops.yaml \
              > "$RUNNER_TEMP/prod-secrets.json"
            echo "managed=true" >> "$GITHUB_OUTPUT"
          else
            echo "managed=false" >> "$GITHUB_OUTPUT"
            echo "No SOPS-managed identities configured: prod runs with throwaway keys." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: 3. Rebuild prod from the previous bundle
        run: |
          from=$(python3 -c "import json; print(json.load(open('prod/fetched.json'))['from']['bundle'])")
          to=$(python3 -c "import json; print(json.load(open('prod/fetched.json'))['to']['bundle'])")
          "$RUNNER_TEMP/venv/bin/python" scripts/prod.py extract --bundle "$from" --dest prod/run/from --out results/extract-from.json
          "$RUNNER_TEMP/venv/bin/python" scripts/prod.py extract --bundle "$to" --dest prod/run/to --out results/extract-to.json
          secrets=""
          [ -f "$RUNNER_TEMP/prod-secrets.json" ] && secrets="$RUNNER_TEMP/prod-secrets.json"
          make deploy VENV="$RUNNER_TEMP/venv" RENDER=prod/run/from/lab SECRETS="$secrets"
          # The plaintext is needed only to start the lab.
          rm -f "$RUNNER_TEMP/prod-secrets.json"
      - name: 3b. Drift check before the change, against the previous bundle
        # A baseline for 5a: what differs after the apply but not before was introduced by it.
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/prod.py drift --new prod/run/from/lab --out results/drift-before.json || true'
      - name: 4. Apply the new bundle in place while probes count failures
        run: >-
          "$RUNNER_TEMP/venv/bin/python" scripts/prod.py apply --running prod/run/from/lab
          --new prod/run/to/lab --out results/apply.json
      - name: 5a. Drift check
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/prod.py drift --new prod/run/to/lab --out results/drift.json'
      - name: 5b. Gate 2 against prod after the change, with the tests of the applied version
        if: ${{ !cancelled() }}
        env:
          PP_RENDER: prod/run/from/lab
        run: |
          # The tests that belong to the bundle just applied, not whatever main holds today.
          to_commit=$(python3 -c "import json; print(json.load(open('prod/fetched.json'))['to']['commit'])")
          git fetch -q --depth=1 origin "$to_commit"
          git checkout -q FETCH_HEAD -- tests/live
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/live -q -p no:cacheprovider             --junitxml results/gate2-after-change.xml
      - name: 5c. Prod runs its SOPS-managed identities
        if: ${{ !cancelled() && steps.decrypt.outputs.managed == 'true' }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/prod.py identities --running prod/run/from/lab --out results/identities.json'
      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          r = pathlib.Path("results")
          def load(n):
              p = r / n
              return json.loads(p.read_text()) if p.exists() else {}
          v, a, d, d0 = load("verify.json"), load("apply.json"), load("drift.json"), load("drift-before.json")
          ids = load("identities.json")
          print("### Prod change")
          print(f"- bundles verified: {v.get('ok')}; tampered bundle refused: {v.get('tampered', {}).get('refused')}")
          print(f"- in-place apply took {a.get('apply_seconds')} s; failed requests: {a.get('requests_failed')}; "
                f"TCP connections broken: {a.get('connections_broken')}")
          print(f"- probes: `{json.dumps(a.get('probes'))}`")
          print(f"- drift before the change: {json.dumps(d0.get('routers'))}")
          print(f"- drift self-test: {d.get('self_test')}; no drift after the change: {d.get('ok')}")
          print(f"- drift after the change: {json.dumps(d.get('routers'))}")
          if ids:
              print(f"- SOPS-managed identities in use: {ids.get('ok')} `{json.dumps(ids)}`")
          else:
              print("- SOPS-managed identities: not configured or not checked")
          PY
          python3 scripts/junit_summary.py results/gate2-after-change.xml "Gate 2 after the change" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Collect evidence and destroy
        if: always()
        run: |
          if [ -f prod/run/from/lab/intent.json ]; then
            "$RUNNER_TEMP/venv/bin/python" -m packetproof evidence --render prod/run/from/lab --out evidence || true
            "$RUNNER_TEMP/venv/bin/python" -m packetproof destroy --render prod/run/from/lab || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: prod
          path: |
            results/
            evidence/
            prod/fetched.json
          retention-days: 90
