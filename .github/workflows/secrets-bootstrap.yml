name: secrets-bootstrap

# Creates prod's long-lived identities: a WireGuard key for each site router and the lab CA's
# root. They are generated on this runner, encrypted with SOPS to the repository's age recipient
# (the SOPS_AGE_RECIPIENT variable; scripts/bootstrap-sops-key.ps1 sets it) and handed out as an
# artifact holding only ciphertext and public halves. The plaintext never leaves the runner and is
# never printed. Run on demand; docs/secrets.md describes the lifecycle.
on:
  workflow_dispatch:

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RECIPIENT: ${{ vars.SOPS_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SOPS 3.13.3, checking its checksum
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c
          chmod +x "$RUNNER_TEMP/sops"
      - name: Build the images whose tools generate the keys
        run: make images
      - name: Install Python dependencies, hash-locked
        run: make venv VENV="$RUNNER_TEMP/venv"
      - name: Generate, encrypt, and destroy the plaintext
        run: |
          set -euo pipefail
          if [ -z "$RECIPIENT" ]; then
            echo "The SOPS_AGE_RECIPIENT variable is not set: run scripts/bootstrap-sops-key.ps1 first." >&2
            exit 1
          fi
          umask 077
          plain=$(mktemp -d)
          trap 'sudo rm -rf "$plain"' EXIT
          for r in rtr-a rtr-b; do
            docker run --rm --entrypoint wg packetproof/router:dev genkey > "$plain/$r.key"
            docker run --rm -i --entrypoint wg packetproof/router:dev pubkey < "$plain/$r.key" > "$plain/$r.pub"
          done
          docker run --rm -v "$plain:/w" --entrypoint sh packetproof/node:dev -c \
            'STEP="$(command -v step || command -v step-cli)"; "$STEP" certificate create "PacketProof Prod Root CA" /w/root_ca.crt /w/root_ca.key --profile root-ca --not-after 87600h --no-password --insecure > /dev/null && chown "$(stat -c %u /w)" /w/root_ca.*'
          mkdir -p out/secrets
          "$RUNNER_TEMP/venv/bin/python" scripts/secrets_files.py --plain "$plain" \
            --out-secret "$plain/prod.yaml" --out-public out/secrets/prod-public.yaml
          "$RUNNER_TEMP/sops" encrypt --age "$RECIPIENT" --input-type yaml --output-type yaml \
            "$plain/prod.yaml" > out/secrets/prod.sops.yaml
          # Prove the file holds no plaintext before it leaves the runner. (`! grep` would not
          # stop the script under `set -e`, hence the explicit exits.)
          for r in rtr-a rtr-b; do
            if grep -qF -- "$(cat "$plain/$r.key")" out/secrets/prod.sops.yaml; then echo "plaintext key found" >&2; exit 1; fi
          done
          if grep -q "PRIVATE KEY" out/secrets/prod.sops.yaml; then echo "plaintext CA key found" >&2; exit 1; fi
          grep -q "ENC\[AES256_GCM" out/secrets/prod.sops.yaml
          echo "Encrypted to $RECIPIENT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-secrets
          path: out/secrets/
          retention-days: 7
