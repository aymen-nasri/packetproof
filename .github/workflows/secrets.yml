name: secrets

# The secrets lifecycle with SOPS and age, proved end to end with throwaway keys: encrypt a
# WireGuard private key and a CA key to one age recipient, rotate to a new recipient with a new
# data key, and check that the new key decrypts, the old key no longer does, and the values did
# not change. No real secret is involved and nothing leaves the runner.
on:
  pull_request:
    paths:
      - ".github/workflows/secrets.yml"
      - "scripts/sops_rotation.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/secrets.yml"
      - "scripts/sops_rotation.sh"
  schedule:
    - cron: "11 4 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SOPS 3.13.3 and age 1.3.2, checking their checksums
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  $RUNNER_TEMP/sops" | sha256sum -c
          curl -fsSLo "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  $RUNNER_TEMP/age.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP" --strip-components 1 age/age age/age-keygen
          chmod +x "$RUNNER_TEMP/sops"
      - name: Rotate and prove it
        run: |
          # pipefail: without it the step would take tee's exit code and pass on a failed check
          set -o pipefail
          PATH="$RUNNER_TEMP:$PATH" bash scripts/sops_rotation.sh | tee -a "$GITHUB_STEP_SUMMARY"
