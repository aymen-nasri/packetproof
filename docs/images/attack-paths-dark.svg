<text x="42" y="338" class="s" font-size="14.5" fill="#f0f6fc" font-weight="600">A compromised DMZ host</text>
<text x="42" y="358.5" class="s" font-size="11.5" fill="#9198a1">A throwaway container in haproxy&#x27;s</text>
<text x="42" y="374.5" class="s" font-size="11.5" fill="#9198a1">network namespace: every packet</text>
<text x="42" y="390.5" class="s" font-size="11.5" fill="#9198a1">carries haproxy&#x27;s real address,</text>
<text x="42" y="406.5" class="s" font-size="11.5" fill="#9198a1">172.16.20.10</text>
<text x="300" y="114" class="s" font-size="10.5" fill="#9198a1" font-weight="600" letter-spacing="0.06em">ATTACK · MUST BE BLOCKED</text>
<text x="640" y="114" class="s" font-size="10.5" fill="#9198a1" font-weight="600" letter-spacing="0.06em">LEGITIMATE TWIN · MUST PASS IN THE SAME TEST</text>
