<text x="32" y="46" class="s" font-size="21" font-weight="650" fill="#f0f6fc">Twelve attack paths from a compromised DMZ host</text>
<text x="32" y="70" class="s" font-size="13.5" fill="#9198a1">Each attack must be blocked while a legitimate flow of the same kind passes in the same test, so a firewall that blocks everything fails.</text>
