<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 732" width="960" height="732" role="img" aria-labelledby="t d">
<title id="t">The network at a glance</title><desc id="d">Two sites joined by a WireGuard tunnel over an ISP. Site A runs five zones behind one router; site B is one user network.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
