<text x="648" y="633" class="s" font-size="10.5" fill="#9198a1" font-weight="600" letter-spacing="0.06em">NOTES</text>
<text x="650" y="657" class="s" font-size="12" fill="#9198a1">Interfaces eth2 and up face the zones, in the</text>
<text x="650" y="673.5" class="s" font-size="12" fill="#9198a1">order network.yaml lists them.</text>
<text x="650" y="698" class="s" font-size="12" fill="#9198a1">Each zone is one Linux bridge. A router is the</text>
<text x="650" y="714.5" class="s" font-size="12" fill="#9198a1">only device on more than one, so every packet</text>
<text x="650" y="731" class="s" font-size="12" fill="#9198a1">between zones meets its firewall.</text>
<text x="650" y="755.5" class="s" font-size="12" fill="#9198a1">Inside addresses are private (RFC 1918); public</text>
<text x="650" y="772" class="s" font-size="12" fill="#9198a1">ones come from the documentation ranges (RFC</text>
<text x="650" y="788.5" class="s" font-size="12" fill="#9198a1">5737).</text>
<text x="936" y="877" class="s" font-size="10.5" fill="#6e7681" text-anchor="end">from network.yaml · drawn by scripts/diagrams.py</text>
</svg>
