<rect x="580" y="140" width="156" height="46" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.25"/>
<text x="658" y="160" class="s" font-size="13.5" fill="#1f2328" font-weight="650" text-anchor="middle">app1 · app2</text>
<text x="658" y="176" class="s" font-size="11" fill="#59636e" text-anchor="middle">HTTP backends</text>
