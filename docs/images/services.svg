<text x="32" y="46" class="s" font-size="21" font-weight="650" fill="#1f2328">How the services work together</text>
<text x="32" y="70" class="s" font-size="13.5" fill="#59636e">Split-horizon DNS, a private CA issuing certificates over ACME, and a health-checked proxy, followed message by message.</text>
