<text x="375.333" y="835" class="s" font-size="11.5" fill="#1f2328">DNAT to 172.16.20.10:443</text>
<rect x="24" y="912" width="912" height="74" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/>
<text x="44" y="938" class="s" font-size="10.5" fill="#59636e" font-weight="600" letter-spacing="0.06em">WATCHING IT</text>
<text x="44" y="958" class="s" font-size="12.5" fill="#1f2328">mon runs Prometheus, blackbox_exporter and Grafana in LAN-A, probing like a user: www-https, www-tls-expiry, dns-www.</text>
<text x="44" y="976" class="s" font-size="12" fill="#59636e">Only resolver may query the internet; it forwards example.net to the outside test server. Health checks: every 1000 ms, down after 2 failures.</text>
<text x="936" y="1006" class="s" font-size="10.5" fill="#818b98" text-anchor="end">from network.yaml · drawn by scripts/diagrams.py</text>
